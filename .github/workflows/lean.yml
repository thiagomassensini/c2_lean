name: Lean

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: auto

  audit:
    name: axiom audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit final endpoints
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: auto
          lake-package-directory: .
          extra-deps: |
            lake exe cache get
            bash scripts/audit_axioms.sh
